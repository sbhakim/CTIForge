# CTIForge config for OpenRouter (gemini-2.5-flash-lite)

llm:
  provider: openrouter
  models:
    openrouter: openrouter/mistralai/mistral-small-3.1-24b-instruct
    openai: gpt-4o
    local_mistral: huggingface/mistralai/Mistral-7B-Instruct-v0.3
  temperature: 0.1
  max_tokens: 4096
  retry_attempts: 3
  structured_output:
    # Experimental provider-side JSON mode is kept available in code but
    # disabled here. Targeted verification on the SG failure docs showed no
    # recovery benefit on this OpenRouter + Mistral path.
    enabled: false
    type: json_object

embedding:
  provider: local
  models:
    local: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

extraction:
  few_shot_examples: 3
  max_chunk_chars: 2000
  overlap_chars: 200
  max_triples_per_chunk: 15
  first_pass:
    # Conservative rollback: the stricter first pass improved some weak docs,
    # but it also zeroed out previously healthy ones in targeted verification.
    temperature: null
    max_tokens: null
  compact_mode:
    enabled: false
    min_chunk_chars: 900
    max_triples: 8
    temperature: 0.0
    max_tokens: 1800

validation:
  reject_missing_evidence: true
  reject_unsupported_by_evidence: true
  max_triples_per_chunk: 15
  min_entity_name_length: 2
  min_confidence_threshold: 0.2

canonicalization:
  similarity_threshold: 0.85
  use_alias_tables: true
  merge_ioc_by_exact_match: true

link_prediction:
  enabled: true
  max_predictions: 5
  # Experimental recovery-aware LP guard is left disabled in the active config.
  # A 20-doc benchmark with the 0.5 threshold regressed sharply vs the kept
  # recovery-only baseline, so the code path remains available but inactive.
  skip_if_recovery_share_at_least: null

entity_alignment:
  enabled: true

supplement_extraction:
  enabled: false

document_fallback:
  # Experimental document-level fallback is kept in code but disabled here.
  # Targeted OpenRouter verification did not recover the failure documents.
  enabled: false
  single_chunk_only: true
  max_raw_triples: 2
  max_validated_triples: 1
  max_new_triples: 8

focused_recovery:
  # Experimental focused recovery remains in code but is disabled here.
  # Targeted verification on the SG failure slice did not recover any triples.
  enabled: false
  single_chunk_only: true
  max_raw_triples: 2
  max_validated_triples: 1
  max_sentences: 6
  max_new_triples: 8

low_yield_recovery:
  enabled: true
  min_triples_per_chunk: 1
  max_new_triples: 8

guided_reextraction:
  enabled: false

confidence_rescoring:
  enabled: false
  prune_threshold: 0.45

saliency_filter:
  enabled: true
  max_triples_per_doc: 20

relation_repair:
  promote_associated_with: true
  require_entity_mentions: false

fusion:
  min_confidence_for_merge: 0.5
  preserve_provenance: true

paths:
  annotations: data/annotations/ctinexus
  external: data/external
  processed: data/processed
  error_taxonomy: data/error_taxonomy
