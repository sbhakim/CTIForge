# CTIForge default configuration

llm:
  # Active provider. Switch this between `openai` and one of the local_* entries
  # below. The corresponding model is resolved from `llm.models`.
  provider: openai
  models:
    openai: gpt-4o
    local_qwen: huggingface/Qwen/Qwen3-8B
    local_mistral: huggingface/mistralai/Mistral-7B-Instruct-v0.3
    local_llama: huggingface/meta-llama/Llama-3.1-8B
    deepseek: deepseek/deepseek-chat
    anthropic: anthropic/claude-sonnet-4-20250514
    gemini: gemini/gemini-2.0-flash
  temperature: 0.1
  max_tokens: 4096
  retry_attempts: 3
  structured_output:
    enabled: false
    type: json_object

  # Recommended local default once the local inference stack is installed:
  # provider: local_qwen
  #
  # Other reasonable fallbacks:
  # provider: local_mistral
  # provider: local_llama
  #
  # Note: the current `cti` environment does not include `torch`, so the local
  # Hugging Face options are not runnable yet without installing that stack.

embedding:
  provider: local
  models:
    local: sentence-transformers/all-MiniLM-L6-v2
    local_large: BAAI/bge-large-en-v1.5
  batch_size: 32

extraction:
  few_shot_examples: 3
  max_chunk_chars: 2000
  overlap_chars: 200
  first_pass:
    temperature: null
    max_tokens: null
  compact_mode:
    enabled: false
    min_chunk_chars: 900
    max_triples: 8
    temperature: 0.0
    max_tokens: 1800

validation:
  reject_missing_evidence: true
  reject_unsupported_by_evidence: true
  max_triples_per_chunk: 25
  min_entity_name_length: 2
  min_confidence_threshold: 0.2

canonicalization:
  similarity_threshold: 0.85
  use_alias_tables: true
  merge_ioc_by_exact_match: true

link_prediction:
  enabled: true
  max_predictions: 5
  skip_if_recovery_share_at_least: null

entity_alignment:
  enabled: true

supplement_extraction:
  enabled: true

document_fallback:
  enabled: false
  single_chunk_only: true
  max_raw_triples: 2
  max_validated_triples: 1
  max_new_triples: 8

focused_recovery:
  enabled: false
  single_chunk_only: true
  max_raw_triples: 2
  max_validated_triples: 1
  max_sentences: 6
  max_new_triples: 8

relation_repair:
  promote_associated_with: true
  require_entity_mentions: false

fusion:
  min_confidence_for_merge: 0.5
  preserve_provenance: true

evaluation:
  num_seeds: 3
  report_confidence_intervals: true

paths:
  annotations: data/annotations/ctinexus
  external: data/external
  processed: data/processed
  error_taxonomy: data/error_taxonomy
