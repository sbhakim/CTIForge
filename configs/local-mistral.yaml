# CTIForge local-only configuration using cached Mistral 7B Instruct v0.3

llm:
  provider: local_mistral
  models:
    openai: gpt-4o
    local_qwen: huggingface/Qwen/Qwen3-8B
    local_mistral: huggingface/mistralai/Mistral-7B-Instruct-v0.3
    local_llama: huggingface/meta-llama/Llama-3.1-8B
  temperature: 0.0
  max_tokens: 4096
  retry_attempts: 3
  local:
    system_prompt: "You extract cyber threat intelligence triples from incident reports."
    do_sample: false
    max_new_tokens: 1280
    prompt_template: extraction_local_mistral.jinja

embedding:
  provider: local
  models:
    local: sentence-transformers/all-MiniLM-L6-v2
    local_large: BAAI/bge-large-en-v1.5
  batch_size: 32

extraction:
  few_shot_examples: 2
  max_chunk_chars: 1400
  overlap_chars: 120
  max_sentences_per_chunk: 8
  max_chars_per_example: 700
  max_triples_per_example: 4

validation:
  reject_missing_evidence: true
  reject_unsupported_by_evidence: true
  max_triples_per_chunk: 25
  min_entity_name_length: 2
  min_confidence_threshold: 0.2

canonicalization:
  similarity_threshold: 0.85
  use_alias_tables: true
  merge_ioc_by_exact_match: true

relation_repair:
  promote_associated_with: true
  require_entity_mentions: false

fusion:
  min_confidence_for_merge: 0.5
  preserve_provenance: true

evaluation:
  num_seeds: 3
  report_confidence_intervals: true

paths:
  annotations: data/annotations/ctinexus
  external: data/external
  processed: data/processed
  error_taxonomy: data/error_taxonomy
